<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMANA SHIELD — Electoral & Government Scam Verification</title>
  <meta name="description" content="AI-powered electoral and government scam verification for Nigerian citizens. Check suspicious messages, URLs, and empowerment claims.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col antialiased">
  <div id="root" class="flex-grow flex flex-col"></div>

  <script type="text/babel">
    const { useState } = React;

    function Header({ language, setLanguage }) {
      return (
        <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
          <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-lg bg-emerald-700 text-white font-bold flex items-center justify-center text-lg shadow-sm">
                AS
              </div>
              <div>
                <h1 class="text-lg font-bold text-slate-900 tracking-tight leading-tight">AMANA SHIELD</h1>
                <p class="text-xs text-slate-500 font-medium">AI4Elections Nigeria • Citizen Protection</p>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <div class="flex bg-slate-100 p-0.5 rounded-lg border border-slate-200 text-xs font-medium">
                <button
                  onClick={() => setLanguage('en')}
                  class={`px-2.5 py-1 rounded-md transition ${language === 'en' ? 'bg-white text-slate-900 shadow-sm font-semibold' : 'text-slate-600 hover:text-slate-900'}`}
                >
                  English
                </button>
                <button
                  onClick={() => setLanguage('ha')}
                  class={`px-2.5 py-1 rounded-md transition ${language === 'ha' ? 'bg-white text-slate-900 shadow-sm font-semibold' : 'text-slate-600 hover:text-slate-900'}`}
                >
                  Hausa
                </button>
              </div>
              <a
                href="/analyst"
                class="text-xs text-emerald-800 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 px-3 py-1.5 rounded-lg font-medium transition"
              >
                Analyst Portal
              </a>
            </div>
          </div>
        </header>
      );
    }

    function VerdictCard({ evaluation, language }) {
      if (!evaluation) return null;

      const verdict = evaluation.verdict;
      const explanation = evaluation.available_localizations?.[language] || evaluation.primary_explanation;

      const styles = {
        MALICIOUS: {
          border: 'border-red-400',
          bg: 'bg-red-50/60',
          badgeBg: 'bg-red-600',
          badgeText: 'text-white',
          title: language === 'ha' ? '🚨 TARIHI: BABBAN HADARI (MALICIOUS)' : '🚨 DANGER: MALICIOUS CONTENT DETECTED',
        },
        SUSPICIOUS: {
          border: 'border-amber-400',
          bg: 'bg-amber-50/60',
          badgeBg: 'bg-amber-500',
          badgeText: 'text-white',
          title: language === 'ha' ? '⚠️ HANKALI: SAKO MAI SHAKKU (SUSPICIOUS)' : '⚠️ CAUTION: SUSPICIOUS CONTENT',
        },
        OFFICIAL: {
          border: 'border-emerald-500',
          bg: 'bg-emerald-50/60',
          badgeBg: 'bg-emerald-600',
          badgeText: 'text-white',
          title: language === 'ha' ? '✅ TABBATACCE: DAGA HUKUMA (OFFICIAL)' : '✅ OFFICIAL & VERIFIED CONTENT',
        },
        UNVERIFIED: {
          border: 'border-slate-300',
          bg: 'bg-slate-100/70',
          badgeBg: 'bg-slate-600',
          badgeText: 'text-white',
          title: language === 'ha' ? 'ℹ️ BA A TABBATAR BA (UNVERIFIED)' : 'ℹ️ UNVERIFIED CONTENT',
        },
      }[verdict] || {
        border: 'border-slate-300',
        bg: 'bg-slate-50',
        badgeBg: 'bg-slate-600',
        badgeText: 'text-white',
        title: 'VERDICT',
      };

      return (
        <section aria-labelledby="verdict-heading" class={`rounded-xl border-2 ${styles.border} ${styles.bg} p-5 md:p-6 shadow-sm space-y-4`}>
          <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-200/60 pb-3">
            <span class={`text-xs uppercase font-extrabold px-3 py-1 rounded-full ${styles.badgeBg} ${styles.badgeText} tracking-wider`}>
              {verdict}
            </span>
            <div class="text-xs text-slate-500 flex items-center gap-3">
              <span>Msg Risk: <strong class="text-slate-700">{evaluation.message_risk}</strong></span>
              <span>•</span>
              <span>URL Risk: <strong class="text-slate-700">{evaluation.url_risk}</strong></span>
              <span>•</span>
              <span>Claims: <strong class="text-slate-700">{evaluation.claim_verification_status}</strong></span>
            </div>
          </div>

          <div>
            <h2 id="verdict-heading" class="text-xl font-extrabold text-slate-900 tracking-tight">
              {styles.title}
            </h2>
            <p class="text-slate-800 mt-2 leading-relaxed text-base font-normal">
              {explanation.summary}
            </p>
          </div>

          {/* Warning Signs */}
          {explanation.reasons && explanation.reasons.length > 0 && (
            <div class="bg-white/90 rounded-lg p-4 border border-slate-200 shadow-2xs">
              <h3 class="text-sm font-bold text-slate-900 flex items-center gap-2">
                <span>⚠️</span>
                <span>{language === 'ha' ? 'Dalilan Fadakarwa (Warning Signs):' : 'Important Warning Signs:'}</span>
              </h3>
              <ul class="mt-2 space-y-1.5 text-sm text-slate-700 list-disc list-inside">
                {explanation.reasons.map((r, i) => (
                  <li key={i} class="leading-snug">{r}</li>
                ))}
              </ul>
            </div>
          )}

          {/* Evidence Points */}
          {explanation.evidence_points && explanation.evidence_points.length > 0 && (
            <div class="bg-white/90 rounded-lg p-4 border border-slate-200 shadow-2xs">
              <h3 class="text-sm font-bold text-slate-900 flex items-center gap-2">
                <span>🔍</span>
                <span>{language === 'ha' ? 'Hujjoji daga Hukuma (Verified Evidence):' : 'Verified Evidence & Fact-Checks:'}</span>
              </h3>
              <ul class="mt-2 space-y-1.5 text-sm text-slate-700 list-disc list-inside">
                {explanation.evidence_points.map((ev, i) => (
                  <li key={i} class="leading-snug">{ev}</li>
                ))}
              </ul>
            </div>
          )}

          {/* Uncertainty Note */}
          {explanation.uncertainty_note && (
            <div class="p-3 bg-slate-200/60 rounded-md text-xs text-slate-700 italic border border-slate-300/80">
              {explanation.uncertainty_note}
            </div>
          )}

          {/* Recommended Action */}
          <div class="bg-slate-900 text-white rounded-lg p-4 space-y-1">
            <span class="text-xs uppercase font-bold text-emerald-400 tracking-wider">
              {language === 'ha' ? 'Abin da Ya Kamata Ka Yi (Recommended Action)' : 'Recommended Action'}
            </span>
            <p class="text-sm font-medium leading-relaxed text-slate-100">
              {explanation.recommended_action}
            </p>
          </div>
        </section>
      );
    }

    function PublicVerificationPortal() {
      const [language, setLanguage] = useState('en');
      const [messageText, setMessageText] = useState('');
      const [websiteUrl, setWebsiteUrl] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [evaluation, setEvaluation] = useState(null);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError(null);
        setEvaluation(null);

        const combinedText = [
          messageText.trim(),
          websiteUrl.trim()
        ].filter(Boolean).join('\n\n');

        if (!combinedText) {
          setError(
            language === 'ha'
              ? 'Da fatan za a rubuta sako ko adireshin yanar gizo kafin bincike.'
              : 'Please enter a message text or website URL to analyze.'
          );
          return;
        }

        setLoading(true);
        try {
          const res = await fetch('/api/v1/fusion/evaluate-text', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              text: combinedText,
              language: language,
              preferred_language: language,
            }),
          });

          if (!res.ok) {
            const errJson = await res.json().catch(() => ({}));
            throw new Error(errJson?.error?.message || `Analysis failed (HTTP ${res.status})`);
          }

          const data = await res.json();
          setEvaluation(data);
        } catch (err) {
          setError(err.message || 'Unable to connect to verification server. Please try again.');
        } finally {
          setLoading(false);
        }
      };

      const handleClear = () => {
        setMessageText('');
        setWebsiteUrl('');
        setError(null);
        setEvaluation(null);
      };

      return (
        <div class="flex-grow flex flex-col">
          <Header language={language} setLanguage={setLanguage} />

          <main class="flex-grow max-w-4xl mx-auto w-full px-4 py-8 space-y-8">
            {/* Hero Banner */}
            <div class="text-center max-w-2xl mx-auto space-y-2">
              <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">
                <span class="w-2 h-2 rounded-full bg-emerald-600 animate-pulse"></span>
                Official Verification Service
              </span>
              <h2 class="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight">
                {language === 'ha'
                  ? 'Bincika Sakonni da Hanyoyin Yanar Gizo na Bogi'
                  : 'Check Electoral Messages & Suspicious Government Links'}
              </h2>
              <p class="text-slate-600 text-sm leading-relaxed">
                {language === 'ha'
                  ? 'Kare kanka da al\'ummar ka daga labaran karya, satar bayanan sirri (BVN/NIN), da tallafin bogi na zabe.'
                  : 'Verify INEC electoral notices, federal empowerment grant claims, and voter registration links before trusting or sharing.'}
              </p>
            </div>

            {/* Input Form */}
            <form onSubmit={handleSubmit} class="bg-white border border-slate-200 rounded-2xl p-5 md:p-6 shadow-xs space-y-5">
              <div>
                <label for="message-input" class="block text-sm font-semibold text-slate-800 mb-1.5">
                  {language === 'ha' ? 'Rubutun Sako Mai Shakku (Message Text):' : 'Suspicious Message Text:'}
                </label>
                <textarea
                  id="message-input"
                  rows={4}
                  value={messageText}
                  onChange={(e) => setMessageText(e.target.value)}
                  placeholder={
                    language === 'ha'
                      ? 'Kwafi sakon WhatsApp ko SMS a nan... (misali: "Hukumar INEC tana bada N50,000...")'
                      : 'Paste the WhatsApp, SMS, or social media text here (e.g. "FG 50,000 grant application is open...")'
                  }
                  class="w-full rounded-xl border border-slate-300 p-3.5 text-sm focus:border-emerald-600 focus:ring-2 focus:ring-emerald-600/20 outline-none transition resize-y text-slate-900 placeholder:text-slate-400"
                ></textarea>
              </div>

              <div>
                <label for="url-input" class="block text-sm font-semibold text-slate-800 mb-1.5">
                  {language === 'ha' ? 'Adireshin Yanar Gizo (Website URL / Link):' : 'Website URL or Link (Optional):'}
                </label>
                <input
                  id="url-input"
                  type="text"
                  value={websiteUrl}
                  onChange={(e) => setWebsiteUrl(e.target.value)}
                  placeholder="https://example.com/claim-grant or inecnigeria-pvc.org"
                  class="w-full rounded-xl border border-slate-300 p-3 text-sm focus:border-emerald-600 focus:ring-2 focus:ring-emerald-600/20 outline-none transition text-slate-900 placeholder:text-slate-400"
                />
              </div>

              {error && (
                <div role="alert" class="p-3.5 rounded-xl bg-red-50 border border-red-200 text-red-800 text-sm flex items-start gap-2.5">
                  <span class="text-base leading-none">⚠️</span>
                  <span class="leading-snug">{error}</span>
                </div>
              )}

              <div class="flex flex-wrap items-center justify-between gap-3 pt-2">
                <button
                  type="button"
                  onClick={handleClear}
                  disabled={loading || (!messageText && !websiteUrl)}
                  class="text-xs font-semibold text-slate-500 hover:text-slate-800 px-3 py-2 rounded-lg transition disabled:opacity-40"
                >
                  {language === 'ha' ? 'Share / Sake Fara' : 'Clear Form'}
                </button>

                <button
                  type="submit"
                  disabled={loading}
                  class="bg-emerald-700 hover:bg-emerald-800 text-white font-semibold text-sm px-6 py-2.5 rounded-xl shadow-xs transition flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
                >
                  {loading && (
                    <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                    </svg>
                  )}
                  <span>
                    {loading
                      ? (language === 'ha' ? 'Ana Bincike...' : 'Analyzing Indicators...')
                      : (language === 'ha' ? 'Bincika Yanzu' : 'Analyze Safety Now')}
                  </span>
                </button>
              </div>
            </form>

            {/* Results Display */}
            {evaluation && (
              <VerdictCard evaluation={evaluation} language={language} />
            )}
          </main>

          <footer class="bg-white border-t border-slate-200 mt-12 py-6 text-center text-xs text-slate-500 space-y-1">
            <p>© 2026 AMANA SHIELD • AI4Elections Nigeria • Independent Civic Safety Architecture</p>
            <p>Designed for public security without tracking or personal data collection.</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PublicVerificationPortal />);
  </script>
</body>
</html>
